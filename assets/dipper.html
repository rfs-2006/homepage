<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R.F.S.</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:root{
  --ink:#f4f6fb; --ink2:#c9cfdb; --ink3:#8e97a8;
  --night:#0B1524;
  --sans:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  --serif:"Noto Serif KR",serif;
  --ease:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{overflow:hidden}
a{color:inherit;text-decoration:none}

.sky{position:relative;width:100vw;height:100vh;min-height:560px;overflow:hidden;background:var(--night);cursor:default}

/* ---------- photo layer ---------- */
.photo{position:absolute;inset:-24px;will-change:transform}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;display:block;
  filter:brightness(.74) saturate(.8) contrast(1.05);opacity:0;transition:opacity 1.1s ease}
.photo.flip img{transform:scaleX(-1)}
.ready .photo img{opacity:1}
.wash{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(15,27,46,.55) 0%,rgba(20,38,72,.38) 55%,rgba(11,21,36,.7) 100%);mix-blend-mode:multiply}
.wash2{position:absolute;inset:0;pointer-events:none;background:rgba(32,56,100,.16);mix-blend-mode:color}
.shade{position:absolute;inset:0;pointer-events:none;
  background:
   radial-gradient(ellipse 60% 52% at 52% 50%, rgba(3,5,10,.34) 0%, rgba(3,5,10,0) 70%),
   radial-gradient(ellipse 120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%),
   linear-gradient(180deg, rgba(2,3,8,.35) 0%, rgba(2,3,8,0) 18%, rgba(2,3,8,0) 70%, rgba(2,3,8,.55) 100%)}

/* ---------- cursor light ---------- */
.torch{position:absolute;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  pointer-events:none;background:radial-gradient(circle, rgba(190,210,255,.055) 0%, rgba(190,210,255,0) 60%);
  mix-blend-mode:screen;opacity:0;transition:opacity .6s}
.sky.pointer .torch{opacity:1}

/* ---------- constellation layer ---------- */
.dipper{position:absolute;inset:0;will-change:transform}
svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.seg{stroke:#dfe7ff;stroke-width:.9;stroke-opacity:.30;stroke-linecap:round;fill:none;
  stroke-dasharray:1;stroke-dashoffset:1;
  transition:stroke-opacity .5s var(--ease), stroke-width .5s var(--ease)}
.seg.drawn{stroke-dashoffset:0;transition:stroke-dashoffset .55s cubic-bezier(.6,0,.2,1), stroke-opacity .5s var(--ease), stroke-width .5s var(--ease)}
.seg.hi1{stroke-opacity:.92;stroke-width:1.15}
.seg.hi2{stroke-opacity:.55}
.seg.hi3{stroke-opacity:.40}
.has-on .seg:not(.hi1):not(.hi2):not(.hi3){stroke-opacity:.16}
.pulse{stroke:#fff;stroke-width:1.6;stroke-linecap:round;fill:none;opacity:0;filter:url(#soft)}
.pulse.run{animation:comet 1.05s var(--ease) forwards}
@keyframes comet{0%{opacity:0;stroke-dashoffset:0}12%{opacity:1}100%{opacity:0;stroke-dashoffset:-1.1}}

.guide{stroke:#e8edff;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:0 8;fill:none;stroke-opacity:0;
  transition:stroke-opacity 1s ease}
.guide.on{stroke-opacity:0}
.guide.hot{stroke-opacity:0}
.guide-flow{stroke:#fff;stroke-width:1.4;stroke-linecap:round;fill:none;opacity:0;stroke-dasharray:.08 1}
.guide-flow.run{animation:flow 1.4s cubic-bezier(.5,0,.3,1) forwards}
@keyframes flow{0%{opacity:0;stroke-dashoffset:.08}15%{opacity:1}100%{opacity:0;stroke-dashoffset:-1}}

/* ---------- stars ---------- */
.star{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;z-index:2;outline:none;
  --s:1; --tint:236,242,255; opacity:0; transition:opacity .6s ease}
.star.lit{opacity:1}
.star:focus-visible .ring{border-color:#fff}
.has-on .star.lit:not(.on){opacity:.5}
.star > span:not(.lab){position:absolute;left:50%;top:50%;pointer-events:none}
.glow{width:calc(46px*var(--s));height:calc(46px*var(--s));transform:translate(-50%,-50%) scale(.9);border-radius:50%;
  background:radial-gradient(circle, rgba(var(--tint),.55) 0%, rgba(var(--tint),.17) 22%, rgba(var(--tint),0) 62%);
  transition:transform .7s var(--ease), opacity .7s var(--ease);opacity:.85}
.core{width:calc(9px*var(--s));height:calc(9px*var(--s));transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle, #fff 0%, #fff 30%, rgba(var(--tint),.85) 48%, rgba(var(--tint),0) 72%);
  transition:transform .6s var(--ease)}
.spk{height:1px;width:calc(64px*var(--s));transform:translate(-50%,-50%) scaleX(.85);
  background:linear-gradient(90deg, rgba(var(--tint),0) 0%, rgba(var(--tint),.18) 22%, rgba(255,255,255,.95) 50%, rgba(var(--tint),.18) 78%, rgba(var(--tint),0) 100%);
  transition:transform .9s var(--ease), opacity .9s var(--ease);opacity:.9}
.spk.v{transform:translate(-50%,-50%) rotate(90deg) scaleX(.85)}
.spk.d{width:calc(30px*var(--s));opacity:.0;transform:translate(-50%,-50%) rotate(45deg) scaleX(.4)}
.spk.d2{width:calc(30px*var(--s));opacity:.0;transform:translate(-50%,-50%) rotate(-45deg) scaleX(.4)}
.ring{width:38px;height:38px;transform:translate(-50%,-50%) scale(.55);border-radius:50%;
  border:1px solid rgba(255,255,255,.55);opacity:0;transition:transform .7s var(--ease), opacity .5s ease}

/* ignite */
.star .core{animation:none}
.star.igniting .glow{animation:ignite 1s var(--ease)}
@keyframes ignite{0%{transform:translate(-50%,-50%) scale(.1);opacity:0}35%{transform:translate(-50%,-50%) scale(1.8);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:.85}}

/* hover / focus */
.star.on{z-index:3}
.star.on .core{transform:translate(-50%,-50%) scale(1.4)}
.star.on .glow{transform:translate(-50%,-50%) scale(1.85);opacity:1;animation:twinkle 2.4s ease-in-out .7s infinite}
.star.on .spk.h{transform:translate(-50%,-50%) scaleX(2.5);opacity:1}
.star.on .spk.v{transform:translate(-50%,-50%) rotate(90deg) scaleX(2.5);opacity:1}
.star.on .spk.d{transform:translate(-50%,-50%) rotate(45deg) scaleX(1);opacity:.35}
.star.on .spk.d2{transform:translate(-50%,-50%) rotate(-45deg) scaleX(1);opacity:.35}
.star.on .ring{transform:translate(-50%,-50%) scale(1);opacity:.5}
.wave{width:38px;height:38px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.6);opacity:0}
.star.on .wave{animation:wave 1.3s cubic-bezier(.15,.6,.3,1) forwards}
@keyframes wave{0%{transform:translate(-50%,-50%) scale(.6);opacity:.55}100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}}
@keyframes twinkle{0%,100%{opacity:1}18%{opacity:.78}31%{opacity:1}52%{opacity:.86}70%{opacity:1}}

/* labels */
.lab{position:absolute;white-space:nowrap;pointer-events:none;
  text-shadow:0 0 2px rgba(0,0,0,.9),0 1px 10px rgba(0,0,0,.75),0 0 22px rgba(0,0,0,.5)}
.lab b{display:block;font-weight:600;font-size:13px;letter-spacing:.22em;color:#e9edf6;
  transition:color .4s, letter-spacing .6s var(--ease)}
.lab i{display:block;font-style:normal;font-size:12.5px;font-weight:500;letter-spacing:.02em;color:#ffffff;
  opacity:0;transform:translateY(-5px);transition:opacity .45s ease, transform .6s var(--ease);margin-top:6px}
.lab small{display:block;font-size:10.5px;letter-spacing:.14em;color:#aab3c4;opacity:0;margin-top:3px;
  transform:translateY(-4px);transition:opacity .45s ease .08s, transform .6s var(--ease) .08s;font-weight:500}
.star.on .lab b{color:#fff;letter-spacing:.26em}
.star.on .lab i,.star.on .lab small{opacity:1;transform:none}
.lab.r{left:calc(50% + 22px);top:calc(50% - 9px)}
.lab.l{right:calc(50% + 22px);top:calc(50% - 9px);text-align:right}
.lab.b{left:50%;top:calc(50% + 22px);transform:translateX(-50%);text-align:center}
.lab.t{left:50%;bottom:calc(50% + 20px);transform:translateX(-50%);text-align:center}
.lab.t{display:flex;flex-direction:column-reverse;align-items:center}
.lab.t i{margin:0 0 6px}.lab.t small{margin:0 0 3px}
.lab.t i,.lab.t small{transform:translateY(5px)}
.lab.tl{right:calc(50% + 16px);bottom:calc(50% + 14px);text-align:right}
.lab.tl i,.lab.tl small{transform:translateY(5px)}
.lab.bl{right:calc(50% + 14px);top:calc(50% + 12px);text-align:right}

/* alcor */
.alcor{position:absolute;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:#eef2ff;
  box-shadow:0 0 4px 1px rgba(220,230,255,.55);opacity:0;transition:opacity 1s ease;pointer-events:none}
.alcor.lit{opacity:.85}
.has-on .alcor{opacity:.45}

/* polaris */
.polaris .seal{position:absolute;left:calc(50% + 28px);top:calc(50% - 24px);width:48px;height:48px;opacity:.8;
  transition:opacity .5s, transform .7s var(--ease);filter:drop-shadow(0 0 10px rgba(0,0,0,.6))}
.polaris .lab{left:calc(50% + 90px);top:calc(50% - 9px)}
.polaris .lab b{letter-spacing:.2em}
.polaris.on .seal{opacity:1;transform:scale(1.06)}

/* ---------- chrome ---------- */
.brand{position:absolute;left:44px;top:36px;z-index:5;display:flex;align-items:baseline;gap:14px;
  opacity:0;transition:opacity 1s ease .2s}
.brand strong{font-size:19px;font-weight:700;letter-spacing:.12em}
.brand span{font-size:12px;color:var(--ink2);letter-spacing:.08em;font-weight:500}
.ready .brand{opacity:1}

.copy{position:absolute;left:44px;bottom:40px;z-index:5;max-width:460px;opacity:0;transform:translateY(8px);
  transition:opacity 1.2s ease, transform 1.2s var(--ease);text-shadow:0 1px 14px rgba(0,0,0,.6)}
.copy.on{opacity:1;transform:none}
.copy h1{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.35;letter-spacing:-.01em;color:#eef1f7}
.copy h1 b{font-weight:700;color:#fff}
.copy p{word-break:keep-all;margin-top:10px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.copy p em{font-style:italic;font-family:var(--serif);color:#e4e8f0}
.copy .stats{margin-top:16px;font-size:11.5px;letter-spacing:.16em;color:var(--ink3);font-weight:500;font-variant-numeric:tabular-nums}
.copy .stats span{color:#d7dce6}

.credit{position:absolute;right:20px;bottom:12px;z-index:5;font-size:10px;color:rgba(200,207,220,.55);letter-spacing:.03em}
.credit a:hover{color:#fff}
.hint{position:absolute;right:44px;top:38px;z-index:5;font-size:11px;letter-spacing:.18em;color:var(--ink3);
  opacity:0;transition:opacity 1s ease}
.hint.on{opacity:1}

/* static / reduced motion */
.static *,.static *::before{transition:none!important;animation:none!important}
@media (prefers-reduced-motion: reduce){
  *,*::before{transition-duration:.01ms!important;animation:none!important}
}
@media (max-width:760px){
  .brand{left:16px;top:18px}.brand span{display:none}
  .copy{left:16px;right:16px;bottom:30px}.copy h1{font-size:21px}
  .lab b{font-size:11px;letter-spacing:.16em}.lab i{font-size:11px}
  .hint{display:none}
  .tall .polaris .seal{width:40px;height:40px;top:calc(50% + 20px);left:calc(50% - 20px)}
  .tall .polaris .lab{left:50%;top:calc(50% + 68px);transform:translateX(-50%);text-align:center}
  .tall .polaris .lab b{letter-spacing:.14em}
  .tall .lab small{display:none}
  .credit{right:16px;left:16px;bottom:8px;font-size:9px}
  .copy p{font-size:12.5px}
}

/* motto */
.motto{position:absolute;left:50%;transform:translateX(-50%);bottom:15vh;z-index:3;pointer-events:none;text-align:center;white-space:nowrap;padding-top:10px;padding-bottom:10px;cursor:default;
  font-family:var(--sans);font-weight:300;font-size:13px;letter-spacing:.6em;padding-left:.6em;
  color:#dfe6f5;opacity:0;transition:opacity 3s ease, color .6s ease, text-shadow .8s ease, letter-spacing 1.2s var(--ease)}
.motto.on{opacity:.26;pointer-events:auto}
.motto.on:hover{opacity:1;color:#fff;letter-spacing:.68em;transition:opacity .6s ease, color .6s ease, text-shadow .8s ease, letter-spacing 1.2s var(--ease);
  text-shadow:0 0 8px rgba(220,232,255,.9),0 0 22px rgba(170,195,255,.65),0 0 48px rgba(140,170,255,.4)}
.sky.shine .seg{stroke-opacity:.75;stroke-width:1.1;transition:stroke-opacity .8s var(--ease), stroke-width .8s var(--ease)}
.sky.shine .star.lit .glow{transform:translate(-50%,-50%) scale(1.35);opacity:1}
.sky.shine .star.lit .spk.h{transform:translate(-50%,-50%) scaleX(1.6)}
.sky.shine .star.lit .spk.v{transform:translate(-50%,-50%) rotate(90deg) scaleX(1.6)}
@media (max-width:760px){.motto.on{opacity:.2}.motto{bottom:9vh;font-size:11px;letter-spacing:.5em;padding-left:.5em}}
</style>
</head>
<body>
<main class="sky" id="sky">
  <div class="photo" id="photo"><img id="photoImg" alt="" src=""></div>
  <div class="wash"></div><div class="wash2"></div>
  <div class="shade"></div>
  <div class="torch" id="torch"></div>

  <div class="dipper" id="dipper">
    <svg class="lines" id="lines" aria-hidden="true">
      <defs><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
    </svg>
  </div>



  <div class="motto" id="motto"></div>
  <div class="credit" id="credit"></div>
</main>

<script>
(() => {
  /* ---- photo choice (?photo=1|2|3) ---- */
  const PHOTOS = {1:{src:(innerWidth<760?'hero/sky-m.webp':'hero/sky.webp'), flip:false, pos:'50% 40%', credit:'Photo: Unsplash'}};
  const q = new URLSearchParams(location.search);
  const P = PHOTOS[q.get('photo')] || PHOTOS[1];
  const img = document.getElementById('photoImg');
  img.src = P.src; img.style.objectPosition = P.pos;
  if (q.has('flip')) P.flip = q.get('flip') !== '0';
  document.getElementById('photo').classList.toggle('flip', P.flip);
  document.getElementById('credit').innerHTML = P.credit;

  /* ---- real positions (J2000 RA/Dec, degrees) ---- */
  const STARS = [
    {id:'dubhe',  name:'Dubhe',  bayer:'α UMa', ra:165.932, de:61.751, mag:1.79, tint:'255,222,186', menu:'RESEARCH',   ko:'기업 분석 리포트',      href:'/#research', lab:'r'},
    {id:'merak',  name:'Merak',  bayer:'β UMa', ra:165.460, de:56.383, mag:2.37, tint:'236,242,255', menu:'FUND',       ko:'AMT 펀드 운용',         href:'/fund/',     lab:'r'},
    {id:'phecda', name:'Phecda', bayer:'γ UMa', ra:178.457, de:53.695, mag:2.44, tint:'236,242,255', menu:'AGORA',      ko:'학회원 공간',           href:'/#intranet',    lab:'b'},
    {id:'megrez', name:'Megrez', bayer:'δ UMa', ra:183.857, de:57.033, mag:3.31, tint:'240,244,255', menu:'PEOPLE',     ko:'임원진 · 동문',          href:'/#people',   lab:'bl'},
    {id:'alioth', name:'Alioth', bayer:'ε UMa', ra:193.507, de:55.960, mag:1.77, tint:'236,242,255', menu:'RECRUITING', ko:'신입 모집',             href:'/#recruit',  lab:'b'},
    {id:'mizar',  name:'Mizar',  bayer:'ζ UMa', ra:200.981, de:54.925, mag:2.04, tint:'236,242,255', menu:'RFM',        ko:'Road to Fund Manager', href:'/#rfm',      lab:'t'},
    {id:'alkaid', name:'Alkaid', bayer:'η UMa', ra:206.885, de:49.313, mag:1.86, tint:'214,226,255', menu:'ABOUT',      ko:'학회 소개',             href:'/#about',    lab:'b'},
  ];
  const ALCOR   = {ra:201.306, de:54.988};
  const POLARIS = {ra:37.95,  de:89.264};
  const EDGES = [['alkaid','mizar'],['mizar','alioth'],['alioth','megrez'],['megrez','dubhe'],['dubhe','merak'],['merak','phecda'],['phecda','megrez']];
  const IGNITE = ['alkaid','mizar','alioth','megrez','phecda','merak','dubhe'];

  // gnomonic projection, sky view (east to the left, north up)
  const R = Math.PI/180, A0 = 186*R, D0 = 56*R;
  function proj(ra, de){
    ra*=R; de*=R;
    const c = Math.sin(D0)*Math.sin(de)+Math.cos(D0)*Math.cos(de)*Math.cos(ra-A0);
    const x = Math.cos(de)*Math.sin(ra-A0)/c;
    const y = (Math.cos(D0)*Math.sin(de)-Math.sin(D0)*Math.cos(de)*Math.cos(ra-A0))/c;
    return [-x/R, y/R];
  }
  // wide screens: rotated -18° so the dipper lies flat and the pointers aim straight up at Polaris.
  // narrow (portrait) screens: rotated +72° so the dipper stands upright, bowl on top, Polaris to the left.
  const WIDE_ROT = q.has('rot') ? parseFloat(q.get('rot')) : -18, TALL_ROT = 72;
  const LABELS_TALL = {dubhe:'t', merak:'r', phecda:'r', megrez:'l', alioth:'r', mizar:'l', alkaid:'r'};
  STARS.forEach(s => s.raw = proj(s.ra, s.de));
  const alcorRaw = proj(ALCOR.ra, ALCOR.de);
  function rot([x,y], deg){ const a=deg*R; return [x*Math.cos(a)-y*Math.sin(a), x*Math.sin(a)+y*Math.cos(a)]; }

  /* ---- build DOM ---- */
  const dipper = document.getElementById('dipper'), svg = document.getElementById('lines');
  const NS = 'http://www.w3.org/2000/svg';
  const byId = {};
  STARS.forEach(s => {
    const a = document.createElement('a');
    a.className = 'star'; a.href = s.href; a.target = '_top'; a.dataset.id = s.id;
    a.setAttribute('aria-label', `${s.menu} — ${s.ko}`);
    const size = Math.max(.86, Math.min(1.3, 1.3 - (s.mag-1.77)*0.38));
    a.style.setProperty('--s', size.toFixed(2)); a.style.setProperty('--tint', s.tint);
    a.innerHTML = `<span class="glow"></span><span class="wave"></span><span class="ring"></span><span class="spk h"></span><span class="spk v"></span><span class="spk d"></span><span class="spk d2"></span><span class="core"></span>
      <span class="lab ${s.lab}"><b>${s.menu}</b><i>${s.ko}</i><small>${s.name.toUpperCase()} · ${s.bayer}</small></span>`;
    dipper.appendChild(a); s.el = a; byId[s.id] = s;
  });
  const alcor = document.createElement('span'); alcor.className = 'alcor'; dipper.appendChild(alcor);

  const pol = document.createElement('span'); pol.style.display='none';

  const segs = EDGES.map(([a,b]) => {
    const l = document.createElementNS(NS,'line'); l.setAttribute('class','seg'); l.setAttribute('pathLength','1');
    svg.appendChild(l);
    const p = document.createElementNS(NS,'line'); p.setAttribute('class','pulse'); p.setAttribute('pathLength','1');
    p.style.strokeDasharray = '.10 1.2'; svg.appendChild(p);
    return {a,b,l,p};
  });
  const guide = document.createElementNS(NS,'line'); guide.setAttribute('class','guide'); svg.appendChild(guide);
  const gflow = document.createElementNS(NS,'line'); gflow.setAttribute('class','guide-flow'); gflow.setAttribute('pathLength','1'); svg.appendChild(gflow);

  const sky = document.getElementById('sky');
  /* ---- layout ---- */
  let W, H, scr = {}, polScr;
  function layout(){
    W = innerWidth; H = innerHeight;
    const narrow = W < 760 && H > W;
    const deg = narrow ? TALL_ROT : WIDE_ROT;
    STARS.forEach(s => { s.p = rot(s.raw, deg); s.el.querySelector('.lab').className = 'lab ' + (narrow ? LABELS_TALL[s.id] : s.lab); });
    const alcorP = rot(alcorRaw, deg);
    sky.classList.toggle('tall', narrow);
    const xs = STARS.map(s=>s.p[0]), ys = STARS.map(s=>s.p[1]);
    const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
    const k = narrow ? Math.min(.32*W/(maxX-minX), .44*H/(maxY-minY)) : Math.min(.50*W/(maxX-minX), .34*H/(maxY-minY));
    const cx = W*(narrow?.52:.5), cy = H*(narrow?.48:.5);
    const midX=(minX+maxX)/2, midY=(minY+maxY)/2;
    const to = ([x,y]) => [cx+(x-midX)*k, cy-(y-midY)*k];
    STARS.forEach(s => { const [x,y] = to(s.p); scr[s.id]=[x,y]; s.el.style.left=x+'px'; s.el.style.top=y+'px'; });
    // Alcor: true direction from Mizar, separation stretched ×2.4 so it clears Mizar's glow
    const [mzx,mzy] = scr.mizar, [ax0,ay0] = to(alcorP);
    alcor.style.left=(mzx+(ax0-mzx)*2.4)+'px'; alcor.style.top=(mzy+(ay0-mzy)*2.4)+'px';
    // Polaris: on the true Merak→Dubhe pointer line, distance compressed to fit the frame
    const [mx,my]=scr.merak, [dx,dy]=scr.dubhe;
    let ux=dx-mx, uy=dy-my; const L=Math.hypot(ux,uy); ux/=L; uy/=L;
    const t = narrow ? (dx - W*.13)/(-ux) : (dy - H*.12)/(-uy);
    polScr = [dx+ux*t, dy+uy*t];
    pol.style.left=polScr[0]+'px'; pol.style.top=polScr[1]+'px';
    segs.forEach(s => {
      const [x1,y1]=scr[s.a],[x2,y2]=scr[s.b];
      const len=Math.hypot(x2-x1,y2-y1), gx=(x2-x1)/len, gy=(y2-y1)/len, G=9;   // leave a hair of dark sky around each star
      s.l.setAttribute('x1',x1+gx*G);s.l.setAttribute('y1',y1+gy*G);s.l.setAttribute('x2',x2-gx*G);s.l.setAttribute('y2',y2-gy*G);
    });
    // guide: from just past Dubhe to just short of Polaris
    const gx1=dx+ux*16, gy1=dy+uy*16, gx2=polScr[0]-ux*16, gy2=polScr[1]-uy*16;
    [guide,gflow].forEach(g=>{g.setAttribute('x1',gx1);g.setAttribute('y1',gy1);g.setAttribute('x2',gx2);g.setAttribute('y2',gy2);});
    window.__layout = {scr, polScr, k};
  }
  layout(); addEventListener('resize', layout);

  /* ---- hover: light spreads outward from the star through the figure ---- */
  const adj = {}; EDGES.forEach(([a,b]) => { (adj[a]=adj[a]||[]).push(b); (adj[b]=adj[b]||[]).push(a); });
  function depthFrom(id){ const d={[id]:0}, qq=[id]; while(qq.length){const u=qq.shift(); (adj[u]||[]).forEach(v=>{ if(d[v]==null){d[v]=d[u]+1; qq.push(v);} });} return d; }
  let current = null;
  function activate(id){
    if (current === id) return; deactivate(); current = id;
    const el = id==='polaris' ? pol : byId[id].el;
    el.classList.add('on'); dipper.classList.add('has-on');
    if (id === 'polaris' || id === 'dubhe' || id === 'merak') guide.classList.add('hot');
    if (id === 'polaris') { gflow.classList.remove('run'); void gflow.getBBox(); gflow.classList.add('run'); return; }
    const d = depthFrom(id);
    segs.forEach(s => {
      const near = Math.min(d[s.a], d[s.b]);
      const cls = near===0 ? 'hi1' : near===1 ? 'hi2' : near===2 ? 'hi3' : '';
      s.l.style.transitionDelay = (near*110)+'ms';
      s.l.classList.remove('hi1','hi2','hi3'); if (cls) s.l.classList.add(cls);
      if (near === 0) { // comet leaving the hovered star
        const from = s.a===id ? scr[s.a] : scr[s.b], to = s.a===id ? scr[s.b] : scr[s.a];
        s.p.setAttribute('x1',from[0]);s.p.setAttribute('y1',from[1]);s.p.setAttribute('x2',to[0]);s.p.setAttribute('y2',to[1]);
        s.p.classList.remove('run'); void s.p.getBBox(); s.p.classList.add('run');
      }
    });
  }
  function deactivate(){
    if (!current) return;
    const el = current==='polaris' ? pol : byId[current].el;
    el.classList.remove('on'); dipper.classList.remove('has-on'); guide.classList.remove('hot');
    segs.forEach(s => { s.l.style.transitionDelay='0ms'; s.l.classList.remove('hi1','hi2','hi3'); });
    current = null;
  }
  dipper.querySelectorAll('.star').forEach(el => {
    el.addEventListener('pointerenter', () => activate(el.dataset.id));
    el.addEventListener('pointerleave', deactivate);
    el.addEventListener('focus', () => activate(el.dataset.id));
    el.addEventListener('blur', deactivate);
  });

  /* ---- parallax + cursor light ---- */
  const photo = document.getElementById('photo'), torch = document.getElementById('torch');
  let tx=0, ty=0, x=0, y=0, px=-999, py=-999;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STATIC = location.hash === '#static' || q.has('static') || reduce;
  sky.addEventListener('pointermove', e => {
    tx = e.clientX/W - .5; ty = e.clientY/H - .5; px = e.clientX; py = e.clientY;
    sky.classList.add('pointer');
  });
  sky.addEventListener('pointerleave', () => { tx = 0; ty = 0; sky.classList.remove('pointer'); });
  function tick(){
    x += (tx-x)*.06; y += (ty-y)*.06;
    photo.style.transform = `translate3d(${(-x*12).toFixed(2)}px, ${(-y*9).toFixed(2)}px, 0)`;
    dipper.style.transform = `translate3d(${(-x*26).toFixed(2)}px, ${(-y*18).toFixed(2)}px, 0)`;
    torch.style.transform = `translate3d(${px}px, ${py}px, 0)`;
    requestAnimationFrame(tick);
  }
  if (!STATIC) requestAnimationFrame(tick);

  /* ---- reveal: photo → stars ignite (Alkaid → Dubhe) → lines → Polaris guide ---- */
  const motto = document.getElementById('motto');
  motto.textContent = 'RISING FINANCIAL STARS';
  motto.addEventListener('pointerenter', () => sky.classList.add('shine'));
  motto.addEventListener('pointerleave', () => sky.classList.remove('shine'));
  const copy = motto, hint = {classList:{add(){}}};
  function finalState(){
    sky.classList.add('ready');
    STARS.forEach(s => s.el.classList.add('lit')); alcor.classList.add('lit'); pol.classList.add('lit');
    segs.forEach(s => s.l.classList.add('drawn')); guide.classList.add('on'); copy.classList.add('on'); hint.classList.add('on');
    window.__done = true;
  }
  if (STATIC) { document.documentElement.classList.add('static'); sky.classList.add('static'); finalState(); return; }
  const go = () => {
    sky.classList.add('ready');                                     // 0.0s photo fades in
    IGNITE.forEach((id,i) => setTimeout(() => {                     // 0.45–1.53s stars ignite
      const el = byId[id].el; el.classList.add('lit','igniting');
      if (id==='mizar') setTimeout(()=>alcor.classList.add('lit'), 250);
      setTimeout(()=>el.classList.remove('igniting'), 1000);
    }, 450 + i*180));
    const order = [['alkaid','mizar'],['mizar','alioth'],['alioth','megrez'],['phecda','megrez'],['merak','phecda'],['dubhe','merak'],['megrez','dubhe']];
    order.forEach(([a,b],i) => setTimeout(() => {                   // 1.25–2.0s lines draw
      const s = segs.find(s => (s.a===a&&s.b===b)||(s.a===b&&s.b===a)); s.l.classList.add('drawn');
    }, 1250 + i*110));
    setTimeout(() => copy.classList.add('on'), 2300);
    setTimeout(() => window.__done = true, 3400);
  };
  let seen = false, loaded = false, started = false;
  const start = () => { if (seen && loaded && !started) { started = true; requestAnimationFrame(go); } };
  if (img.complete && img.naturalWidth) loaded = true; else { img.addEventListener('load', () => { loaded = true; start(); }, {once:true}); img.addEventListener('error', () => { loaded = true; start(); }, {once:true}); }
  new IntersectionObserver((es) => { if (es.some(e => e.isIntersecting)) { seen = true; start(); } }, {threshold:.35}).observe(sky);
  start();
})();
(() => {
  if (window.parent === window) return;
  addEventListener('wheel', (e) => {
    const ev = new WheelEvent('wheel', {deltaX:e.deltaX, deltaY:e.deltaY, deltaMode:e.deltaMode, cancelable:true});
    e.preventDefault();
    if (window.parent.dispatchEvent(ev)) window.parent.scrollBy(0, e.deltaMode ? e.deltaY*16 : e.deltaY);
  }, {passive:false});
})();
</script>
</body>
</html>
