name: RFM 순위 수집

# 평일 장중(08:55~15:40 KST)에는 한 번 로그인해 두고 15초마다 갱신한다.
# 작업 하나의 한도가 6시간이라 오후에 이어받는 실행을 하나 더 두고, 장 마감 뒤 확정치를 한 번 더 받는다.
# (cron은 UTC 기준, GitHub 사정으로 몇 분 늦게 시작될 수 있음)
on:
  schedule:
    - cron: '55 23 * * 0-4'   # 08:55 KST 월~금
    - cron: '20 5 * * 1-5'    # 14:20 KST, 오전 실행이 끝나면 이어받음
    - cron: '10 7 * * 1-5'    # 16:10 KST 마감 후 1회
    - cron: '0 9 * * 1-5'     # 18:00 KST 확정치 1회
  workflow_dispatch:

concurrency:
  group: rfm
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: tools/rfm
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Collect
        working-directory: tools/rfm
        env:
          TF_EMAIL: ${{ secrets.TF_EMAIL }}
          TF_PASSWORD: ${{ secrets.TF_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RFM_MEMBERS: ${{ secrets.RFM_MEMBERS }}
          RFM_UNTIL: '15:40'
          RFM_EVERY: '15'
        run: node collect.mjs
