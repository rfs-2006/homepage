<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R.F.S. 펀드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
<style>
:root{
  --navy:#16295E;
  --ink:#191F28;
  --gray:#6B7684;
  --line:#E5E8EB;
  --soft:#F2F4F6;
  --up:#E42939;
  --down:#1B64DA;
  --bg:#FFFFFF;
  /* 글자 크기 6단계 */
  --t1:120px; --t2:48px; --t3:28px; --t4:20px; --t5:15px; --t6:13px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink);font-size:var(--t5);line-height:1.6;
  -webkit-font-smoothing:antialiased;word-break:keep-all;
}
.num,table,.periods,svg text{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--gray)}
.wrap{width:1120px;margin:0 auto}
.sep{color:#B0B8C1;font-weight:400;margin:0 .45em}

/* 상단 메뉴 */
header{height:72px;border-bottom:1px solid var(--line);background:#fff}
header .wrap{height:100%;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand img{width:36px;height:36px}
.brand b{font-size:var(--t5);font-weight:800;letter-spacing:0.02em;color:var(--navy)}
.brand span{font-size:var(--t6);color:var(--gray);font-weight:500;display:block;line-height:1.3}
nav{display:flex;gap:34px}
nav a{font-size:var(--t6);font-weight:600;letter-spacing:0.06em;color:var(--gray);text-decoration:none}
nav a.on{color:var(--navy)}
nav a.on::after{content:"";display:block;height:2px;background:var(--navy);margin-top:4px}

/* 섹션 공통 */
section{padding:68px 0;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
.eyebrow{font-size:var(--t5);font-weight:700;color:var(--navy);margin-bottom:16px;display:flex;justify-content:space-between}
.eyebrow span{color:var(--gray);font-weight:500}
h2{font-size:var(--t2);font-weight:700;letter-spacing:-0.03em;line-height:1.25;color:var(--ink)}
h2 .sep{margin:0 .3em}
.foot{font-size:var(--t6);color:var(--gray);margin-top:14px}

/* 1. 첫 화면 */
.hero{padding:60px 0 72px}
.hero .label{font-size:var(--t4);font-weight:600;color:var(--gray)}
.nav-row{display:flex;align-items:baseline;gap:28px;margin-top:2px}
.bignum{font-size:var(--t1);font-weight:700;letter-spacing:-0.035em;line-height:1.05;color:var(--ink)}
.dayc{font-size:var(--t4);font-weight:600;color:var(--gray)}
.dayc b{font-weight:700;margin-left:8px}
.hero h1{font-size:var(--t3);font-weight:700;letter-spacing:-0.02em;line-height:1.4;margin-top:36px;color:var(--ink)}
.hero h1 .k{font-weight:600;margin-right:2px}
.hero h1 .sep{margin:0 .55em}

.cmp{margin-top:32px;display:grid;grid-template-columns:120px 1fr;column-gap:0;row-gap:12px;align-items:center}
.cmp .nm{font-size:var(--t5);font-weight:700;color:var(--ink)}
.cmp .nm.sub{color:var(--gray);font-weight:500}
.cmp .ex{text-align:right;font-size:var(--t5);font-weight:600}
.cmp .exh{text-align:right;font-size:var(--t6);font-weight:600;color:var(--gray)}
.track{position:relative;height:32px}
.track .zero{position:absolute;top:-6px;bottom:-6px;width:1px;background:var(--ink)}
.track .bar{position:absolute;top:0;height:32px}
.track .val{position:absolute;top:0;line-height:32px;font-size:var(--t4);font-weight:700;white-space:nowrap}

/* 2. 추이 차트 */
.chart-box{margin-top:40px}
.legend{display:flex;gap:28px;font-size:var(--t6);color:var(--gray);margin-bottom:12px}
.legend i{display:inline-block;width:20px;height:0;border-top:3px solid var(--navy);vertical-align:middle;margin-right:8px}
.legend i.k{border-top:2px solid #8B95A1}
.legend i.q{border-top:2px dashed #B0B8C1}
svg text{font-family:inherit}

/* 3. 기간별 */
.periods{margin-top:40px;display:grid;grid-template-columns:150px repeat(5,1fr);border-top:2px solid var(--ink)}
.periods > div{padding:0 20px 0 0;height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end}
.periods > div.h{font-size:var(--t6);font-weight:600;color:var(--gray);height:58px;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.4}
.periods > div.h span{font-weight:500}
.periods > div.rl{justify-content:flex-start;font-weight:700}
.periods > div.rl.sub{color:var(--gray);font-weight:500}
.periods .amt{font-size:var(--t3);font-weight:700;letter-spacing:-0.02em;height:68px}
.periods > div.rl.main{height:68px}
.periods .ix{font-size:var(--t5);font-weight:600}
.periods .xs{font-size:var(--t5);font-weight:700}
.periods > div.top{border-top:1px solid var(--ink)}
.periods > div.hl{background:var(--soft)}

/* 4. 포트폴리오 */
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin-top:40px;border-top:1px solid var(--line)}
.facts > div{padding:20px 24px 0 0}
.facts .k{font-size:var(--t6);font-weight:600;color:var(--gray)}
.facts .v{font-size:var(--t3);font-weight:700;letter-spacing:-0.02em;margin-top:4px;line-height:1.3}
.facts .s{font-size:var(--t6);color:var(--gray);margin-top:2px}
.alloc{margin-top:48px}
.alloc .row-label{font-size:var(--t6);font-weight:600;color:var(--gray);margin-bottom:8px}
.stack{display:flex;height:48px;gap:2px}
.stack .seg{background:var(--navy);min-width:2px}
.stack .seg.cash{background:#C9CED6}
.stack.thin{height:16px}
.stack.thin .seg{background:#4A5A86}
.stack.thin .seg.cash{background:#C9CED6}
.seglabels{display:flex;gap:2px;margin-top:10px}
.seglabels > div{min-width:2px;overflow:visible;position:relative}
.seglabels .in{font-size:var(--t6);line-height:1.45;white-space:nowrap;color:var(--ink)}
.seglabels .in b{display:block;font-weight:600}
.seglabels .in span{color:var(--gray)}
.sector-labels{display:flex;gap:2px;margin-bottom:8px}
.sector-labels > div{font-size:var(--t6);font-weight:600;color:var(--ink);white-space:nowrap}
.sector-labels > div span{color:var(--gray);font-weight:500;margin-left:6px}

/* 5. 종목 표 */
h3{font-size:var(--t3);font-weight:700;letter-spacing:-0.02em;line-height:1.4;margin-top:64px}
h3 .sep{margin:0 .4em}
table{width:100%;border-collapse:collapse;margin-top:28px}
th{font-size:var(--t6);font-weight:600;color:var(--gray);text-align:right;padding:12px 0 12px 16px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);white-space:nowrap}
td{font-size:var(--t5);text-align:right;padding:11px 0 11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:nth-child(2),td:nth-child(2){text-align:left}
td .nm{font-weight:700}
td .cd{font-size:var(--t6);color:var(--gray);margin-left:8px}
td.sec{color:var(--gray)}
td.ret{font-weight:700}
tr.cash td{color:var(--gray)}
tr.total td{font-weight:700;border-bottom:2px solid var(--ink)}
.wbar{display:inline-block;height:6px;background:var(--navy);vertical-align:middle;margin-right:10px}

footer{padding:36px 0 52px;border-top:1px solid var(--line)}
footer p{font-size:var(--t6);color:var(--gray);line-height:1.8}
</style>
</head>

<header>
  <div class="wrap">
    <a class="brand" href="#"><img src="../rfs-seal-navy.png" alt="R.F.S. 로고"><div><b>R.F.S.</b><span>중앙대학교 가치투자학회</span></div></a>
    <nav>
      <a href="#">RESEARCH</a><a href="#" class="on">FUND</a><a href="#">ABOUT</a><a href="#">PEOPLE</a><a href="#">RECRUITING</a><a href="#">RFM</a><a href="#">AGORA</a>
    </nav>
  </div>
</header>

<main>
  <!-- 1. 기준가 + BM -->
  <section class="hero">
    <div class="wrap">
      <div class="eyebrow" id="asof"></div>
      <div class="label">AMT 펀드 기준가</div>
      <div class="nav-row"><div class="bignum num" id="nav"></div><div class="dayc num" id="navDay"></div></div>
      <h1 class="num" id="heroLine"></h1>
      <div class="cmp num" id="cmp"></div>
      <p class="foot" id="cmpNote"></p>
    </div>
  </section>

  <!-- 2. 기간별 -->
  <section>
    <div class="wrap">
      <div class="eyebrow">기간 수익률<span id="periodSub"></span></div>
      <h2 class="num" id="periodH"></h2>
      <div class="periods" id="periods"></div>
      <p class="foot" id="periodNote"></p>
    </div>
  </section>

  <!-- 3. 추이 -->
  <section>
    <div class="wrap">
      <div class="eyebrow">기준가 추이<span id="trendSub"></span></div>
      <h2 class="num" id="trendH"></h2>
      <div class="chart-box">
        <div class="legend"><span><i></i>AMT</span><span><i class="k"></i>KOSPI</span><span><i class="q"></i>KOSDAQ</span></div>
        <svg id="chart" width="1120" height="330" viewBox="0 0 1120 330"></svg>
        <p class="foot" id="chartNote"></p>
      </div>
    </div>
  </section>

  <!-- 4. 포트폴리오 -->
  <section>
    <div class="wrap">
      <div class="eyebrow">포트폴리오<span id="allocSub"></span></div>
      <h2 class="num" id="allocH"></h2>
      <div class="facts" id="facts"></div>
      <div class="alloc">
        <div class="row-label">업종</div>
        <div class="sector-labels" id="secLabels"></div>
        <div class="stack thin" id="secBar"></div>
        <div class="row-label" style="margin-top:24px">종목</div>
        <div class="stack" id="stockBar"></div>
        <div class="seglabels" id="stockLabels"></div>
        <p class="foot" id="allocNote"></p>
      </div>
      <h3 class="num" id="tableH"></h3>
      <table>
        <thead><tr><th>종목</th><th>업종</th><th>비중</th><th>현재가</th><th>평균단가</th><th>수량</th><th>평가금액</th><th>평가손익</th><th>수익률</th><th>전일 대비</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p id="footNote"></p>
    <p>R.F.S. 중앙대학교 가치투자학회 · 학회 내부 운용 기록이며 투자 권유가 아닙니다.</p>
  </div>
</footer>

  const kChart = (kEnd/1000-1)*100;
  const idxNote = Math.abs(kChart - K) > 0.05 ? `지수선은 ${Number(n0[0].slice(5,7))}/${Number(n0[0].slice(8,10))} 종가=1,000 기준` : '';
  $('chartNote').textContent = [idxNote, '3·6·7월 일부 일자 기준가는 데이터 보정 구간'].filter(Boolean).join(' · ');
})();

// 4. 포트폴리오
const hold = DATA.holdings.map(h=>({...h, sector:SECTOR[h.code]}));
const stockW = 100 - DATA.cashWeight;
const secW = {};
hold.forEach(h=>{ secW[h.sector] = (secW[h.sector]||0) + h.weight; });
const secs = Object.entries(secW).sort((a,b)=>b[1]-a[1]);
const ordered = [];
secs.forEach(([s])=> hold.filter(h=>h.sector===s).sort((a,b)=>b.weight-a.weight).forEach(h=>ordered.push(h)));
const byW = [...hold].sort((a,b)=>b.weight-a.weight);
const top3 = byW.slice(0,3);
const top3W = top3.reduce((s,h)=>s+h.weight,0);
const plSum = hold.reduce((s,h)=>s+h.pl,0);
const dayPlSum = hold.reduce((s,h)=>s+h.dayPl,0);
const ups = hold.filter(h=>h.ret>0).length;

$('allocH').innerHTML = `${hold.length}종목${SEP}주식 ${stockW.toFixed(1)}%${SEP}현금 ${DATA.cashWeight.toFixed(1)}%`;
$('allocSub').textContent = `${dot(lastD)} 종가 평가`;
$('facts').innerHTML = `
  <div><div class="k">순자산</div><div class="v">${f0(DATA.total)}원</div><div class="s">주식 ${f0(DATA.stock)} · 현금 ${f0(DATA.cash)}</div></div>
  <div><div class="k">평가손익 합계</div><div class="v ${cls(plSum)}">${won(plSum)}원</div><div class="s">매입가 대비 ${pct(DATA.plRet)}</div></div>
  <div><div class="k">상위 3종목 비중</div><div class="v">${top3W.toFixed(1)}%</div><div class="s">${top3.map(h=>h.name).join(' · ')}</div></div>
  <div><div class="k">최대 업종 비중</div><div class="v">${secs[0][1].toFixed(1)}%</div><div class="s">${secs[0][0]} · 전체 ${secs.length}개 업종</div></div>`;
(function(){
  const segs = ordered.map(h=>({w:h.weight, lab:h.name, cash:false})).concat([{w:DATA.cashWeight, lab:'현금', cash:true}]);
  $('stockBar').innerHTML = segs.map(s=>`<div class="seg ${s.cash?'cash':''}" style="flex:${s.w} 1 0"></div>`).join('');
  $('stockLabels').innerHTML = segs.map(s=>{
    const show = s.w >= 5.5 || s.cash;
    return `<div style="flex:${s.w} 1 0">${show?`<div class="in"><b>${s.lab}</b><span class="num">${s.w.toFixed(1)}%</span></div>`:''}</div>`;
  }).join('');
  const ss = secs.map(([s,w])=>({s,w})).concat([{s:'현금',w:DATA.cashWeight,cash:true}]);
  $('secBar').innerHTML = ss.map(s=>`<div class="seg ${s.cash?'cash':''}" style="flex:${s.w} 1 0"></div>`).join('');
  $('secLabels').innerHTML = ss.map(s=>`<div style="flex:${s.w} 1 0">${s.w>=8?`${s.s}<span class="num">${s.w.toFixed(1)}%</span>`:''}</div>`).join('');
  const small = segs.filter(s=>!(s.w>=5.5||s.cash));
  const smallSec = ss.filter(s=>s.w<8);
  $('allocNote').textContent = `미표기 — 업종: ${smallSec.map(s=>`${s.s} ${s.w.toFixed(1)}%`).join(', ')} / 종목: ${small.map(s=>`${s.lab} ${s.w.toFixed(1)}%`).join(', ')}`;
})();

// 5. 표
(function(){
  $('tableH').innerHTML = `평가손익 ${span(plSum,won)}원${SEP}수익 ${ups}/${hold.length}종목${SEP}전일 손익 ${span(dayPlSum,won)}원`;
  const maxW = byW[0].weight;
  let rows = byW.map(h=>`<tr>
    <td><span class="nm">${h.name}</span><span class="cd">${h.code}</span></td>
    <td class="sec">${h.sector}</td>
    <td><span class="wbar" style="width:${(h.weight/maxW*56).toFixed(1)}px"></span>${h.weight.toFixed(1)}%</td>
    <td>${f0(h.cur)}</td><td>${f0(h.avg)}</td><td>${h.qty}</td><td>${f0(h.evlt)}</td>
    <td class="${cls(h.pl)}">${won(h.pl)}</td>
    <td class="ret ${cls(h.ret)}">${pct(h.ret)}</td>
    <td class="${cls(h.day)}">${pct(h.day)}</td></tr>`).join('');
  rows += `<tr class="cash"><td><span class="nm">현금</span></td><td class="sec">—</td><td><span class="wbar" style="width:${(DATA.cashWeight/maxW*56).toFixed(1)}px;background:#C9CED6"></span>${DATA.cashWeight.toFixed(1)}%</td><td>—</td><td>—</td><td>—</td><td>${f0(DATA.cash)}</td><td>—</td><td>—</td><td>—</td></tr>`;
  rows += `<tr class="total"><td>합계</td><td></td><td>100.0%</td><td></td><td></td><td></td><td>${f0(DATA.total)}</td><td class="${cls(plSum)}">${won(plSum)}</td><td class="${cls(DATA.plRet)}">${pct(DATA.plRet)}</td><td></td></tr>`;
  $('tbody').innerHTML = rows;
})();

$('footNote').textContent = `데이터 ${DATA.asOf.slice(0,16)} 갱신 · 설정 ${DATA.start} · 기준가 첫 기록 ${H[0][0]} · 단위 원.`;
</script>
</body>
</html>
