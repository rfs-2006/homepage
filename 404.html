<style>
:root{--bg:#F7F6F3;--ink:#1A1A1A;--navy:#203864;--deep:#0F1B2E;--line:rgba(26,26,26,.14);--muted:rgba(26,26,26,.62)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.7}
a{color:var(--navy)}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:960px;margin:0 auto;padding:22px 20px;border-bottom:1px solid var(--line)}
.brand{font-family:'Noto Serif KR',serif;font-weight:700;font-size:18px;color:var(--deep);text-decoration:none}
.brand small{display:block;font-family:'Pretendard Variable',sans-serif;font-weight:400;font-size:11px;letter-spacing:.14em;color:var(--muted)}
.nav nav a{font-size:13px;margin-left:18px;text-decoration:none;color:var(--ink)}
main{max-width:960px;margin:0 auto;padding:40px 20px 72px}
.crumb{font-size:13px;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}
h1,h2,h3{font-family:'Noto Serif KR',serif;color:var(--deep);letter-spacing:-.02em;line-height:1.3}
h1{font-size:clamp(28px,5vw,44px);margin:10px 0 6px}
.headline{font-family:'Noto Serif KR',serif;font-size:clamp(18px,2.6vw,22px);color:var(--navy);margin:0 0 24px}
.cover{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;margin:0 0 28px;background:#e8e6e1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:2px solid var(--deep);border-bottom:1px solid var(--line);margin:0 0 32px}
.stats div{padding:14px 12px 14px 0}
.stats dt{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.stats dd{margin:2px 0 0;font-size:18px;font-weight:600}
section{margin:0 0 32px}
h2{font-size:22px;margin:0 0 10px}
h3{font-size:17px;margin:18px 0 4px}
p{margin:0 0 10px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 36px}
.btn{display:inline-block;padding:14px 26px;border:1px solid var(--navy);text-decoration:none;font-size:14px;font-weight:600}
.btn.solid{background:var(--navy);color:var(--bg)}
.note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.list{list-style:none;padding:0;margin:0}
.list li{border-bottom:1px solid var(--line)}
.list a{display:flex;justify-content:space-between;gap:12px;padding:12px 0;text-decoration:none;color:var(--ink)}
.list .meta{color:var(--muted);font-size:13px;white-space:nowrap}
footer{max-width:960px;margin:0 auto;padding:24px 20px 48px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
@media (max-width:560px){.nav nav a{margin-left:12px}.list a{flex-direction:column;gap:0}}
/* 페이지 전환: 이전 화면은 짧게 사라지고, 새 화면은 살짝 올라오며 나타난다 (View Transitions 지원 브라우저만) */
@media (min-width:1025px){@view-transition{navigation:auto}}
::view-transition-old(root){animation:rfs-vt-out 180ms cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:rfs-vt-in 420ms cubic-bezier(.23,1,.32,1) 60ms both}
@keyframes rfs-vt-out{to{opacity:0}}
@keyframes rfs-vt-in{from{opacity:0;transform:translateY(16px)}}
/* 동작 줄이기 설정에서는 움직임 없이 페이드만 */
@keyframes rfs-vt-fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){::view-transition-new(root){animation-name:rfs-vt-fade}}
