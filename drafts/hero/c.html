.hero{position:relative;height:100vh;min-height:620px;overflow:hidden}

.cnt{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}

.ring{width:20px;height:20px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2}
.ring .bg{stroke:rgba(255,255,255,.25)}
.ring .fg{stroke:#5B9BFF;stroke-dasharray:56.5;stroke-dashoffset:56.5}
.ring.run .fg{animation:ring 6.5s linear forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.down{position:absolute;z-index:5;left:50%;bottom:6vh;transform:translateX(-50%);color:#fff;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,8px)}}
.fade{transition:opacity .5s,transform .6s}
.fade.out{opacity:0;transform:translateY(14px)}
.draftbar{position:fixed;right:12px;bottom:12px;z-index:99;font-size:12px;background:#000;color:#fff;padding:6px 10px;border-radius:4px;opacity:.85}
.draftbar a{color:#8FAADC;text-decoration:none;margin-left:8px}

@media (prefers-reduced-motion:reduce){.slide img,.slide.on img{transform:none;transition:none}.down{animation:none}.ring.run .fg{animation:none}}

.stats div b{font-size:clamp(28px,3.2vw,48px);font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats div.up b{color:#7FB2FF}
@media (max-width:760px){.copy{max-width:none;right:20px}.stats{right:20px;left:20px;bottom:18vh;gap:20px;justify-content:space-between}}

const hero = document.querySelector('.hero'); let i = 0, timer;
hero.insertAdjacentHTML('afterbegin', H.map((h, k) => `<div class="slide${k ? '' : ' on'}"><img src="/${h.bg}" alt=""></div>`).join(''));
const slides = hero.querySelectorAll('.slide');
function show(k) {
  i = (k + H.length) % H.length;
  slides.forEach((s, n) => s.classList.toggle('on', n === i));
  const f = document.querySelectorAll('.fade'); f.forEach((e) => e.classList.add('out'));
  setTimeout(() => { fill(H[i]); f.forEach((e) => e.classList.remove('out')); }, 450);
  document.querySelector('.cur').textContent = String(i + 1).padStart(2, '0');
  const r = document.querySelector('.ring'); r.classList.remove('run'); void r.getBBox(); r.classList.add('run');
  clearTimeout(timer); timer = setTimeout(() => show(i + 1), 6500);
}
document.querySelector('.prev').onclick = () => show(i - 1);
document.querySelector('.next').onclick = () => show(i + 1);
document.querySelector('.tot').textContent = String(H.length).padStart(2, '0');
fill(H[0]); show(0);
