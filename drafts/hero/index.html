<body><main><h1>홈 히어로 시안 (네이버 클라우드 참고)</h1><p>지금 홈 히어로의 리포트 8개를 그대로 써요. 6.5초마다 넘어가고 화살표로도 넘겨요.</p><a href="a.html"><b>A</b><span>네이버 클라우드형</span><small>굵은 고딕 2줄 + 버튼 둘 + 아래 화살표·숫자·원형 타이머 (네이버 클라우드 그대로)</small></a><a href="b.html"><b>B</b><span>명조 유지형</span><small>같은 구조에 지금 사이트의 명조와 투자의견 한 줄</small></a><a href="c.html"><b>C</b><span>큰 숫자형</span><small>왼쪽 제목·요약, 오른쪽 아래 투자의견·목표가·상승여력을 크게</small></a></main></body></html>
