plugins = []

[functions]

  [functions."*"]

[build]
publish = "."

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[redirects]]
from = "https://caurfs.com/*"
to = "https://caurfs.kr/:splat"
status = 301
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "https://www.caurfs.com/*"
to = "https://caurfs.kr/:splat"
status = 301
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "https://remarkable-starlight-e4bf02.netlify.app/*"
to = "https://caurfs.kr/:splat"
status = 301
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

# 보안 헤더: 다른 사이트에 프레임으로 끼워 넣기(클릭재킹) 차단, MIME 스니핑 차단, 리퍼러 최소화, 불필요한 기기 권한 차단
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# 사진·글꼴은 하루 동안 브라우저에 두고, 일주일까지는 바뀌었는지 뒤에서 확인하며 바로 보여준다
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
