<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hebbia형 · 첫 화면 | 챗봇 시안</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#F4F1EB;--black:#0E0B0B;--paper:#F4F1EB;--card:#FFFFFF;--text:#141210;--sub:#6F6A62;--hair:#E3DED4;--band:#ECE8E0;--accent:#8FAADC;--navy:#203864;--hl:#F3E3B0;--pdf:#C9483B}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Pretendard Variable',sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:'Noto Serif KR',serif;font-weight:300;letter-spacing:-.025em}
.lab{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.draftbar{position:fixed;right:12px;bottom:12px;z-index:99;font-size:12px;background:var(--black);color:var(--ink);padding:6px 10px;border-radius:4px;opacity:.85}
.draftbar a{color:var(--accent);text-decoration:none;margin-left:8px}

body{background:var(--black);color:var(--ink);min-height:100vh}
nav{display:flex;align-items:center;gap:12px;padding:18px 36px;font-size:13px}
nav img{width:28px;opacity:.95}
nav b{font-weight:600;letter-spacing:.02em}
nav .r{margin-left:auto;display:flex;gap:22px;color:rgba(244,241,235,.75)}
nav .r span:last-child{background:var(--ink);color:var(--black);padding:6px 12px;border-radius:3px;font-weight:600}
.hero{position:relative;height:46vh;min-height:300px;overflow:hidden;margin:0 36px;border-radius:4px;
 background:linear-gradient(180deg,rgba(14,11,11,0) 40%,var(--black)),url(/assets/hero/fund-snow_dark.webp) center 60%/cover;filter:saturate(.75)}
.c{max-width:760px;margin:-90px auto 0;position:relative;text-align:center;padding:0 16px 60px}
.c .lab{color:rgba(244,241,235,.6)}
h1{font-size:54px;line-height:1.2;margin:14px 0 14px}
h1 em{font-style:normal;color:rgba(244,241,235,.45)}
.c p{color:rgba(244,241,235,.62);font-size:14.5px;line-height:1.8;margin:0 auto 34px;max-width:540px}
.box{background:#F8F6F1;border-radius:10px;padding:14px 14px 10px 18px;text-align:left;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.box textarea{width:100%;border:0;background:none;resize:none;height:54px;font:inherit;font-size:16px;color:var(--text);outline:none}
.box .row{display:flex;align-items:center;gap:6px}
.box .row span{font-size:12px;color:var(--sub);border:1px solid var(--hair);border-radius:999px;padding:4px 10px}
.box .row button{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--text);color:#fff;font-size:16px}
.ex{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.ex span{font-size:13px;color:rgba(244,241,235,.7);border:1px solid rgba(244,241,235,.16);border-radius:999px;padding:6px 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);max-width:760px;margin:10px auto 0;border-top:1px solid rgba(244,241,235,.14);padding:26px 16px 80px;text-align:left}
.stats b{display:block;font-size:40px}
.stats span{font-size:10.5px;letter-spacing:.14em;color:rgba(244,241,235,.55);text-transform:uppercase}
@media (max-width:640px){nav{padding:14px 16px}nav .r span:first-child{display:none}.hero{margin:0 16px;height:34vh}h1{font-size:34px}.stats b{font-size:28px}}

</style>
</head>
<body>

<nav><img src="/assets/rfs-seal-light-256.png" alt=""><b>R.F.S. Research</b><div class="r"><span>인트라넷</span><span>새 대화</span></div></nav>
<div class="hero"></div>
<div class="c">
<div class="lab">Institutional Memory · 2006–2026</div>
<h1 class="serif">리포트 쓰다 막히면,<br><em>여기서 물어보세요</em></h1>
<p>학회 리포트·세미나·엑셀 모델에서 찾아 출처와 함께 답해요. 리포트를 대신 써 드리지는 않고, 고치는 방법과 학회 예시를 알려 드려요.</p>
<div class="box"><textarea placeholder="리포트 쓰다 막힌 곳을 물어보세요"></textarea>
<div class="row"><span>정규 리포트</span><span>세미나·가이드</span><span>엑셀 모델</span><button>↑</button></div></div>
<div class="ex"><span>Peer 어떻게 골라?</span><span>항공사 밸류에이션은 뭘로 해?</span><span>WACC 타인자본비용 잡는 법</span><span>이 문장 봐줘</span></div>
</div>
<div class="stats"><div><b class="serif">2019–2026</b><span>학기 자료</span></div><div><b class="serif">약 200</b><span>정규 리포트</span></div><div><b class="serif">모든 답에</b><span>출처 · 쪽 번호</span></div></div>

</body>
</html>
