        // 실제 RFS 리본 그대로 — 그룹 순서·열 구성·버튼 라벨·아이콘
        const S = function (icon, label) { return { icon: icon, label: label }; };
        const GROUPS = [
          { name: "제목", basis: 86, cols: [
            { size: "sm", items: [S("FontSizeIncrease","대제목"), S("FontColorPicker","중제목"), S("FontSizeDecrease","소제목")] } ] },
          { name: "문단", basis: 174, cols: [
            { size: "sm", items: [S("AlignJustify","본문"), S("BulletsGallery","글머리 ①"), S("ShadingColorPicker","요약박스")] },
            { size: "lg", items: [S("TextBoxInsert","사이드노트")] } ] },
          { name: "자료 틀", basis: 214, cols: [
            { size: "lg", items: [S("ChartInsert","1단 틀"), S("TableDrawTable","2단 틀"), S("ColumnsDialog","3단 틀")] } ] },
          { name: "강조", basis: 116, cols: [
            { size: "sm", items: [S("Bold","강조"), S("FontColorPicker","빨강 강조"), S("FormatPainter","첫문장 볼드")] } ] },

            { size: "lg", items: [{ icon: "ShapesInsertGallery", label: "더보기", caret: true }] } ] },

            { size: "lg", items: [S("ChartInsert","주가 차트"), S("ChartTypeLineInsertGallery","주가 비교"), S("TextBoxInsert","모델 값")] } ] },

        ];

        const root = document.getElementById("chrome");
        const groupsEl = root.querySelector("#groups");
        const total = GROUPS.reduce(function (s, g) { return s + g.basis; }, 0);

        // 그룹의 전역 기하 — 리본은 left 0 / top 206, 탭 44 + 선 2 = 그룹 상단 252, 높이 150
        const GEOM = {};
        var _cum = 0;
        GROUPS.forEach(function (g) {
          var w = (g.basis / total) * 1872;
          GEOM[g.name] = { x: 24 + _cum, y: 252, w: w, h: 150 };
          _cum += w;
        });

        GROUPS.forEach(function (g) {
          const cell = document.createElement("div");
          cell.className = "group";
          cell.dataset.group = g.name;
          cell.style.flex = "0 0 " + ((g.basis / total) * 100).toFixed(4) + "%";

          const fb = document.createElement("div");
          fb.className = "focusbar";
          cell.appendChild(fb);

          const body = document.createElement("div");
          body.className = "gbody";

          g.cols.forEach(function (c) {
            const col = document.createElement("div");
            col.className = "col " + c.size;
            c.items.forEach(function (it) {
              const b = document.createElement("div");
              b.className = (c.size === "sm" ? "sbtn" : "lbtn") + (it.caret ? " caret" : "");
              b.dataset.btn = it.label;
              const img = document.createElement("img");
              img.src = "assets/icons/" + it.icon + ".png";
              img.alt = "";
              const sp = document.createElement("span");
              sp.className = "z";
              sp.textContent = it.label;
              const rg = document.createElement("div");
              rg.className = "ring";
              b.appendChild(img);
              b.appendChild(sp);
              b.appendChild(rg);
              col.appendChild(b);
            });
            body.appendChild(col);
          });

          const lab = document.createElement("div");
          lab.className = "g-label z";
          lab.textContent = g.name;

          cell.appendChild(body);
          cell.appendChild(lab);
          groupsEl.appendChild(cell);
        });

        const q = function (s) { return root.querySelectorAll(s); };
        const one = function (s) { return root.querySelector(s); };
        const C = 2 * Math.PI * 163;
        const ring = one("#ring circle");
        ring.style.strokeDasharray = C;

        const tl = gsap.timeline({ paused: true });

        // ── 1막 · 인트로 ──
        // 1) 도시 위로 인장이 떠오르고 테두리가 그려진다 (배경 사진은 index.html)
        tl.fromTo(one("#sealWrap"), { opacity: 0, x: 0, y: -96, scale: 0.8 },
          { opacity: 1, scale: 0.9, duration: 1.8, ease: "power3.out" }, 0.5);
        tl.fromTo(ring, { strokeDashoffset: C }, { strokeDashoffset: 0, duration: 1.8, ease: "power2.inOut" }, 0.8);
        // 2) 아래 가는 선과 학회 이름 — 사이트 첫 화면 그대로
        tl.fromTo(one("#introCap"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.1);

        tl.fromTo(one("#introCap .tx"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 1.7);
        // 3) 제목
        tl.fromTo(one("#introTitle"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, 2.1);
        tl.fromTo(one("#introTitle .t"), { opacity: 0, y: 16, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.2, ease: "power3.out" }, 2.1);
        // 4) 만든 사람
        tl.fromTo(one("#credit"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, 3.2);
        tl.fromTo(one("#credit .by"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 3.2);
        tl.fromTo(one("#credit .who"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 3.45);
        tl.to([one("#introTitle"), one("#credit"), one("#introCap"), one("#ring")], { opacity: 0, duration: 0.55, ease: "power1.in" }, 4.9);
        // 5) 인장만 좌상단으로, 워드마크는 그 옆에서 켜진다
        tl.to(one("#sealWrap"), { x: -788, y: -424, scale: 0.2133, duration: 1.3, ease: "power3.inOut" }, 5.2);
        tl.fromTo(one("#mark"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" }, 6.1);
        // 6) 리본 — 선이 먼저 그어지고, 판이 가운데부터 올라온다
        tl.fromTo(one("#hairline"), { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power2.inOut" }, 6);
        tl.fromTo(q(".group"), { y: 34, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.75, ease: "power3.out", stagger: { each: 0.075, from: "center" } }, 6.3);
        tl.fromTo(q(".gbody"), { opacity: 0 }, { opacity: 0.55, duration: 0.4, ease: "power1.out", stagger: { each: 0.075, from: "center" } }, 6.8);
        tl.fromTo(q(".g-label"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out", stagger: { each: 0.075, from: "center" } }, 6.8);
        tl.fromTo(q(".tab"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.05 }, 7.2);
        tl.fromTo(one("#sweep"), { x: -280, opacity: 0 }, { x: 1940, opacity: 1, duration: 1.2, ease: "power1.inOut", immediateRender: false }, 7.6);
        tl.to(one("#sweep"), { opacity: 0, duration: 0.25 }, 8.65);
        // 7) 그룹이 왼쪽부터 차례로 켜진다
        tl.fromTo(q(".gbody"), { opacity: 0.55 },
          { opacity: 1, duration: 0.45, ease: "power1.out", stagger: { each: 0.2 }, immediateRender: false }, 8.1);
        tl.fromTo(q(".sbtn span, .lbtn span"), { color: "rgba(247,246,243,0.62)" },
          { color: "rgba(247,246,243,0.92)", duration: 0.45, ease: "power1.out", stagger: { each: 0.025 }, immediateRender: false }, 8.16);
        // 7) 2막으로 — 리본은 위로 붙고 한 톤 가라앉는다
        tl.to(one("#ribbon"), { y: -40, duration: 0.9, ease: "power2.inOut" }, 12.1);
        tl.to(one("#mark"), { y: -18, opacity: 0.85, duration: 0.9, ease: "power2.inOut" }, 12.1);
        tl.to(one("#sealWrap"), { opacity: 0.85, duration: 0.9, ease: "power2.inOut" }, 12.1);


        // ── 막마다 리본을 짚는 헬퍼 ──
        // 원래 타임라인 기준 시각 → 새 시각 (인트로·표지 +6.6초, 주가 비교 입력창 이후 +4.2초)
