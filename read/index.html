<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 읽기 · Polaris | 중앙대 가치투자학회 R.F.S.</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!--
  리포트 PDF 읽기 + Polaris 설명 (학회원 전용)
  - 사용자가 자기 PDF(작성 중인 리포트, 증권사 리포트 등)를 올린다. 파일은 서버로 보내지 않고 이 화면에서만 읽는다
  - PDF는 pdf.js로 그리고 글자 층을 깔아 드래그할 수 있게 한다
  - 드래그하면 'Polaris 설명' 단추가 뜬다. 누르면 드래그한 부분 + 그 쪽 글 + 같은 리포트에서 그 말이 나온 다른 쪽 + 첫 쪽을
    api.caurfs.kr/explain 으로 보낸다 (tools/rag/explain.py). 카페 자료 검색(RAG)은 하지 않는다
-->
<style>
:root{--navy:#001F5F;--ink:#1A1A1A;--mute:#6B6B6B;--hair:#E3E1DA;--bg:#ECEAE4;--card:#FFFFFF;--ac:#2F5597}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.6;word-break:keep-all}
a{color:inherit}
.head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:60px;padding:0 24px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand img{width:30px;height:30px}
.brand b{font-size:14px;letter-spacing:.06em}
.ttl{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--navy)}
.ttl small{font-weight:400;color:var(--mute);margin-left:8px}
.hb{font:inherit;font-size:12.5px;background:none;border:1px solid var(--hair);border-radius:999px;padding:5px 13px;cursor:pointer;white-space:nowrap;color:var(--ink);text-decoration:none}
.hb:hover{border-color:var(--ink)}
.login.on::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#4F9D69;margin-right:6px;vertical-align:1px}
#file{display:none}
.tip{max-width:900px;margin:18px auto 0;padding:0 16px;font-size:13px;color:var(--mute)}
.tip b{color:var(--navy);font-weight:600}
#doc{max-width:960px;margin:12px auto 80px;padding:0 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pg{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.06)}
.pg canvas{display:block;width:100%;height:100%}
.pg .no{position:absolute;right:-2px;bottom:-22px;font-size:11px;color:var(--mute)}
.pg.hit{outline:3px solid #F2D14B;outline-offset:2px;transition:outline-color 1.2s}
/* pdf.js 글자 층 (pdf_viewer.css의 textLayer 부분만) */
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;opacity:1;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:rgba(47,85,151,.28)}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer.selecting .endOfContent{top:0}
.empty{max-width:560px;margin:80px auto;padding:36px 32px;background:var(--card);border:1px solid var(--hair);text-align:center}
.empty h1{font-size:22px;color:var(--navy);margin:0 0 10px}
.empty p{color:var(--mute);margin:0 0 22px}
.btn{display:inline-block;font:inherit;font-size:13px;font-weight:600;letter-spacing:.06em;background:var(--navy);color:#fff;border:0;padding:12px 26px;cursor:pointer;text-decoration:none}
.msg{max-width:560px;margin:60px auto;text-align:center;color:var(--mute)}
/* 드래그하면 뜨는 단추 */
#ask{position:fixed;z-index:30;display:none;align-items:center;gap:7px;font:inherit;font-size:13px;font-weight:600;color:#fff;background:var(--navy);border:0;border-radius:999px;padding:8px 15px 8px 12px;box-shadow:0 6px 18px rgba(0,31,95,.35);cursor:pointer;white-space:nowrap}
#ask svg{width:15px;height:15px}
#ask.on{display:inline-flex}
/* 설명 카드 */
#pop{position:fixed;z-index:31;width:420px;max-width:calc(100vw - 24px);max-height:min(70vh,560px);display:none;flex-direction:column;background:var(--card);border:1px solid var(--hair);border-top:3px solid var(--navy);box-shadow:0 14px 40px rgba(0,0,0,.18)}
#pop.on{display:flex}
#pop .ph{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-size:12px;letter-spacing:.08em;color:var(--navy);font-weight:700}
#pop .ph .x{margin-left:auto;font:inherit;font-size:20px;line-height:1;background:none;border:0;color:var(--mute);cursor:pointer;padding:0 2px}
#pop .q{margin:0 14px;padding:8px 10px;background:#F4F3EF;border-left:3px solid #C9C6BC;font-size:13px;color:#444;max-height:84px;overflow:auto;white-space:pre-wrap}
#pop .a{padding:12px 14px 6px;overflow:auto;font-size:14.5px;line-height:1.72}
#pop .a p{margin:0 0 9px}
#pop .a b{color:var(--navy)}
#pop .a .pl{color:var(--ac);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
#pop .ld{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13.5px}
#pop .ld i{width:14px;height:14px;border:2px solid #C9C6BC;border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#pop .pf{display:flex;align-items:center;gap:10px;padding:8px 14px 12px;border-top:1px solid var(--hair);font-size:12px;color:var(--mute)}
#pop .pf a{margin-left:auto;color:var(--navy);font-weight:600;text-decoration:none}
#pop .err{color:#B4541A}
@media (prefers-reduced-motion:reduce){#pop .ld i{animation:none}}
@media (max-width:720px){
  .head{padding:0 12px;gap:8px}.brand b{display:none}.ttl small{display:none}
  #ask{left:50% !important;top:auto !important;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:11px 20px 11px 16px;font-size:14px}
  #pop{left:0 !important;right:0;top:auto !important;bottom:0;width:auto;max-width:none;max-height:72vh;border-left:0;border-right:0}
}
</style>
</head>
<body>
<header class="head">
  <a class="brand" href="/"><img src="/assets/rfs-seal-navy.png" alt=""><b>R.F.S.</b></a>
  <div class="ttl" id="ttl">Polaris · PDF 읽기</div>
  <a class="hb" href="/chat/">Polaris 채팅</a>
  <label class="hb" for="file">PDF 올리기</label><input type="file" id="file" accept="application/pdf,.pdf">
  <button type="button" class="hb login">로그인</button>
</header>
<p class="tip" id="tip" hidden>궁금한 부분을 <b>드래그</b>하면 Polaris가 이 문서 안의 내용으로 설명해 줍니다. 학회원 로그인 후 쓸 수 있어요.</p>
<main id="doc"></main>
<button type="button" id="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>Polaris 설명</button>
<section id="pop" role="dialog" aria-label="Polaris 설명">
  <div class="ph">POLARIS<button type="button" class="x" aria-label="닫기">×</button></div>
  <div class="q" id="pq"></div>
  <div class="a" id="pa"></div>
  <div class="pf" id="pf"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const SB_URL = 'https://xyewclvpshldjucryapr.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5ZXdjbHZwc2hsZGp1Y3J5YXByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NzI0MTAsImV4cCI6MjEwNTA0ODQxMH0.6JRZhZ6FPh-VUb1RHGf0wxfo_Y69ZQ-V6vk6TCoyM4c';
const P = new URLSearchParams(location.search);
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const API = LOCAL && P.get('api') ? P.get('api') : 'https://api.caurfs.kr';
const $ = (id) => document.getElementById(id);
const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 로그인: 홈페이지와 같은 방식 (이 탭에서만 유지, 로그인 화면은 홈 AGORA 하나)
let store; try { store = window.sessionStorage; store.setItem('rfs_booted', '1'); } catch (e) {}
const sb = window.supabase.createClient(SB_URL, SB_KEY, store ? { auth: { storage: store, persistSession: true } } : { auth: { persistSession: false } });
const goLogin = () => { try { sessionStorage.setItem('rfs_after_login', JSON.stringify({ to: location.pathname + location.search, at: Date.now() })); } catch (e) {} location.href = '/#intranet'; };
const setLogin = (ses) => document.querySelectorAll('.login').forEach((b) => { b.textContent = ses ? '로그아웃' : '로그인'; b.classList.toggle('on', !!ses); });
sb.auth.getSession().then(({ data }) => setLogin(data.session));
sb.auth.onAuthStateChange((_e, ses) => setLogin(ses));
document.querySelector('.login').addEventListener('click', async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) { await sb.auth.signOut(); return; }
  goLogin();
});

// ---------- PDF 열기 ----------
pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
let doc = null, title = '', texts = [];   // texts[n] = n쪽 글 (1부터)
const pages = [];                         // {el, n, done}

function empty() {
  $('doc').innerHTML = '<div class="empty" id="drop"><h1>Polaris와 PDF 읽기</h1><p>리포트 PDF를 올리고 궁금한 부분을 드래그하면, Polaris가 그 문서 안의 내용으로 설명해 줍니다.</p>'
    + '<label class="btn" for="file">PDF 올리기</label><p style="margin:18px 0 0;font-size:13px">파일을 여기로 끌어다 놓아도 됩니다. 올린 파일은 서버에 저장하지 않고 이 화면에서만 읽어요.<br>설명은 학회원 로그인 후 쓸 수 있어요.</p></div>';
}

async function openPdf(src, name) {
  hideAsk(); closePop();
  $('doc').innerHTML = '<p class="msg">PDF를 여는 중…</p>';
  try {
    doc = await pdfjsLib.getDocument({ ...src, cMapUrl: PDFJS + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS + 'standard_fonts/' }).promise;
  } catch (e) {
    $('doc').innerHTML = '<p class="msg">PDF를 열지 못했습니다. 파일을 확인해 주세요.</p>'; return;
  }
  const meta = await doc.getMetadata().catch(() => null);
  title = name || (meta && meta.info && meta.info.Title) || '문서';
  $('ttl').innerHTML = esc(title) + '<small>' + doc.numPages + '쪽</small>';
  document.title = title + ' · PDF 읽기 | R.F.S.';
  $('tip').hidden = false;
  texts = []; pages.length = 0; $('doc').innerHTML = '';
  const first = await doc.getPage(1), vp1 = first.getViewport({ scale: 1 });
  const W = Math.min(900, $('doc').clientWidth - 32 || 900), scale = W / vp1.width;
  for (let n = 1; n <= doc.numPages; n++) {
    const el = document.createElement('div'); el.className = 'pg'; el.dataset.n = n;
    el.style.width = W + 'px'; el.style.height = Math.round(vp1.height * scale) + 'px';
    el.innerHTML = '<span class="no">' + n + ' / ' + doc.numPages + '</span>';
    $('doc').appendChild(el); pages.push({ el, n, done: false, scale });
  }
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) draw(pages[+e.target.dataset.n - 1]); }), { rootMargin: '900px 0px' });
  pages.forEach((p) => io.observe(p.el));
  // 설명할 때 같은 리포트의 다른 쪽을 찾으려고 글자는 미리 다 뽑아 둔다 (그리기와 따로, 가볍다)
  for (let n = 1; n <= doc.numPages; n++) texts[n] = await pageText(n);
}

async function pageText(n) {
  if (texts[n] != null) return texts[n];
  const pg = await doc.getPage(n), tc = await pg.getTextContent();
  return (texts[n] = tc.items.map((it) => it.str + (it.hasEOL ? '\n' : '')).join('').replace(/[ \t]+/g, ' '));
}

async function draw(p) {
  if (p.done) return; p.done = true;
  const pg = await doc.getPage(p.n), vp = pg.getViewport({ scale: p.scale }), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  p.el.style.height = vp.height + 'px';
  const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width * dpr); cv.height = Math.floor(vp.height * dpr);
  p.el.prepend(cv);
  await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null }).promise;
  const tl = document.createElement('div'); tl.className = 'textLayer'; tl.style.setProperty('--scale-factor', vp.scale);
  p.el.appendChild(tl);
  await pdfjsLib.renderTextLayer({ textContentSource: await pg.getTextContent(), container: tl, viewport: vp }).promise;
  const end = document.createElement('div'); end.className = 'endOfContent'; tl.appendChild(end);
  tl.addEventListener('mousedown', () => tl.classList.add('selecting'));
}
document.addEventListener('mouseup', () => document.querySelectorAll('.textLayer.selecting').forEach((t) => t.classList.remove('selecting')));

async function openFile(file) {
  if (!file) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { window.alert('PDF 파일만 열 수 있어요.'); return; }
  openPdf({ data: new Uint8Array(await file.arrayBuffer()) }, file.name.replace(/\.pdf$/i, ''));
}
$('file').addEventListener('change', (e) => { openFile(e.target.files && e.target.files[0]); e.target.value = ''; });
// 화면 어디에나 끌어다 놓아도 연다
document.addEventListener('dragover', (e) => { if ([...(e.dataTransfer.types || [])].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', (e) => { const fl = e.dataTransfer.files && e.dataTransfer.files[0]; if (fl) { e.preventDefault(); openFile(fl); } });

// ---------- 드래그 → 단추 ----------
let selNow = null;   // {text, n, rect}
const ask = $('ask');
function hideAsk() { ask.classList.remove('on'); }
function readSel() {
  const s = window.getSelection();
  if (!s || s.isCollapsed || !s.rangeCount) return null;
  const text = s.toString().replace(/\s+/g, ' ').trim();
  if (text.length < 1) return null;
  const node = s.anchorNode && (s.anchorNode.nodeType === 1 ? s.anchorNode : s.anchorNode.parentElement);
  const pg = node && node.closest('.pg'); if (!pg) return null;
  return { text: text.slice(0, 800), n: +pg.dataset.n, rect: s.getRangeAt(0).getBoundingClientRect() };
}
let selT;
document.addEventListener('selectionchange', () => {
  clearTimeout(selT);
  selT = setTimeout(() => {
    const s = readSel();
    if (!s) { hideAsk(); return; }
    selNow = s;
    const r = s.rect;
    ask.style.left = Math.max(8, Math.min(window.innerWidth - 150, r.left + r.width / 2 - 62)) + 'px';
    ask.style.top = askTop(r) + 'px';
    ask.classList.add('on');
  }, 160);
});
// 선택 바로 위(자리가 없으면 아래)에 두되 화면 밖으로 나가지 않게
function askTop(r) { return Math.max(68, Math.min(window.innerHeight - 52, r.top > 112 ? r.top - 44 : r.bottom + 8)); }
window.addEventListener('scroll', () => { if (ask.classList.contains('on')) { const s = readSel(); if (s) ask.style.top = askTop(s.rect) + 'px'; } }, { passive: true });
// 단추를 누르는 순간 선택이 풀리지 않게
ask.addEventListener('mousedown', (e) => e.preventDefault());
ask.addEventListener('click', () => { if (selNow) explain(selNow); });

// ---------- 설명 ----------
const pop = $('pop');
function closePop() { pop.classList.remove('on'); }
pop.querySelector('.x').addEventListener('click', closePop);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(); });

function place(rect) {
  if (window.innerWidth <= 720) return;
  const w = Math.min(420, window.innerWidth - 24);
  let left = rect.left + rect.width / 2 - w / 2; left = Math.max(12, Math.min(window.innerWidth - w - 12, left));
  const below = window.innerHeight - rect.bottom, top = below > 320 ? rect.bottom + 12 : Math.max(72, rect.top - Math.min(560, window.innerHeight * .7) - 12);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}

// 같은 리포트 안에서 드래그한 말이 나온 다른 쪽 (띄어쓰기·줄바꿈은 무시하고 찾는다)
function findHits(sel, n) {
  const key = sel.replace(/\s+/g, '');
  if (key.length < 2 || key.length > 40) return '';
  const re = new RegExp([...key].map((c) => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\s*'), 'g');
  const out = [];
  for (let k = 1; k < texts.length && out.length < 6; k++) {
    if (k === n || !texts[k]) continue;
    const t = texts[k]; re.lastIndex = 0; const m = re.exec(t); if (!m) continue;
    out.push('(p.' + k + ') …' + t.slice(Math.max(0, m.index - 220), m.index + m[0].length + 220).replace(/\s+/g, ' ').trim() + '…');
  }
  return out.join('\n');
}

const cache = {};
async function explain(s) {
  hideAsk();
  $('pq').textContent = s.text.length > 240 ? s.text.slice(0, 240) + '…' : s.text;
  $('pf').innerHTML = '';
  place(s.rect); pop.classList.add('on');
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    $('pa').innerHTML = '<p>Polaris 설명은 학회원만 쓸 수 있어요.</p><p><button type="button" class="btn" id="lg">학회원 로그인</button></p>';
    $('lg').onclick = goLogin; return;
  }
  const key = s.n + '|' + s.text;
  if (cache[key]) return show(s, cache[key]);
  $('pa').innerHTML = '<div class="ld"><i></i>이 리포트에서 찾아 읽는 중…</div>';
  const t = await pageText(s.n);
  const ctx = [s.n > 1 && texts[s.n - 1] ? '(p.' + (s.n - 1) + ' 끝부분) …' + texts[s.n - 1].slice(-700) : '', '(p.' + s.n + ')\n' + t.slice(0, 5200), s.n < doc.numPages ? '(p.' + (s.n + 1) + ' 앞부분) ' + (await pageText(s.n + 1)).slice(0, 700) + '…' : ''].filter(Boolean).join('\n\n');
  const body = { title, selection: s.text, page: s.n, context: ctx, hits: findHits(s.text, s.n), first: s.n === 1 ? '' : (await pageText(1)).slice(0, 2500) };
  try {
    const r = await fetch(API + '/explain', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + data.session.access_token }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.answer) { $('pa').innerHTML = '<p class="err">' + esc(j.error || '설명을 받지 못했습니다. 잠시 뒤 다시 시도해 주세요.') + '</p>'; return; }
    cache[key] = j; show(s, j);
  } catch (e) {
    $('pa').innerHTML = '<p class="err">Polaris 서버에 연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요.</p>';
  }
}

function fmt(a) {
  return a.split(/\n{2,}/).map((p) => '<p>' + esc(p).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>')
    .replace(/\(p\.\s?(\d+)\)/g, (m, n) => (+n >= 1 && +n <= (doc ? doc.numPages : 0)) ? '<span class="pl" data-p="' + n + '">' + m + '</span>' : m) + '</p>').join('');
}
function show(s, j) {
  $('pa').innerHTML = fmt(j.answer);
  $('pa').querySelectorAll('.pl').forEach((x) => x.onclick = () => {
    const p = pages[+x.dataset.p - 1]; if (!p) return;
    p.el.scrollIntoView({ behavior: 'smooth', block: 'start' }); p.el.classList.add('hit'); setTimeout(() => p.el.classList.remove('hit'), 1600);
  });
  const q = '“' + (s.text.length > 80 ? s.text.slice(0, 80) + '…' : s.text) + '” 이게 무슨 뜻인지 더 자세히 알려줘';
  $('pf').innerHTML = (j.left != null ? '<span>오늘 ' + j.left + '번 남음</span>' : '') + '<a href="/chat/?q=' + encodeURIComponent(q) + '" target="_blank" rel="noopener">Polaris에게 더 물어보기 →</a>';
}

empty();
</script>
</body>
</html>
